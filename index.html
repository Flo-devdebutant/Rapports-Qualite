<!doctype html>
<!-- Mehadrin QC 3.3.3 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme:dark)">
<meta name="description" content="Contrôle qualité fruits & légumes — rapports de réception et d'expédition, photos, PDF et partage.">
<title>Mehadrin QC</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mehadrin QC">
<link rel="stylesheet" href="./app.css">
<script>
/* Appliqué avant le rendu : si le choix de thème était lu par app.js,
   l'écran s'afficherait une fraction de seconde dans la mauvaise
   couleur à chaque ouverture. */
try {
  var t = localStorage.getItem('qc.theme');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>
<div id="app" class="app">
  <div class="center"><div class="spin dark"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
